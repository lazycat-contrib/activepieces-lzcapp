application:
  subdomain: activepieces
  multi_instance: false
  # This app authenticates its own users, so it is exposed directly
  # instead of sitting behind the platform login gate.
  public_path:
    - /
  upstreams:
    - location: /package-licenses/
      backend: file:///lzcapp/pkg/content/licenses/
    - location: /
      backend: http://activepieces:80/

services:
  db:
    image: docker.1ms.run/library/postgres:16-alpine
    environment:
      - POSTGRES_DB=activepieces
      - POSTGRES_USER=activepieces
      - |-
        POSTGRES_PASSWORD={{ stable_secret "activepieces_db_password" | replace "\r" "" | replace "\n" "" }}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U activepieces -d activepieces
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    binds:
      - /lzcapp/var/pgdata:/var/lib/postgresql/data

  redis:
    image: docker.1ms.run/library/redis:7-alpine
    # No published port and no upstream: the cache is only reachable on the
    # app's internal container network.
    command:
      - redis-server
      - --appendonly
      - "yes"
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    binds:
      - /lzcapp/var/redis:/data

  activepieces:
    # upstream: activepieces/activepieces:0.92.3
    image: docker.1ms.run/activepieces/activepieces:0.92.3
    depends_on:
      - db
      - redis
    environment:
      - AP_ENVIRONMENT=prod
      # Must be the public https origin, otherwise generated links and webhook
      # URLs point at the container's internal address.
      - |-
        AP_FRONTEND_URL=https://{{ .S.AppDomain }}
      # Encrypts stored credentials; losing it makes saved connections unreadable.
      - |-
        AP_ENCRYPTION_KEY={{ stable_secret "activepieces_encryption_key" | replace "\r" "" | replace "\n" "" }}
      - |-
        AP_JWT_SECRET={{ stable_secret "activepieces_jwt_secret" | replace "\r" "" | replace "\n" "" }}
      - AP_POSTGRES_HOST=db
      - AP_POSTGRES_PORT=5432
      - AP_POSTGRES_DATABASE=activepieces
      - AP_POSTGRES_USERNAME=activepieces
      - |-
        AP_POSTGRES_PASSWORD={{ stable_secret "activepieces_db_password" | replace "\r" "" | replace "\n" "" }}
      - AP_REDIS_HOST=redis
      - AP_REDIS_PORT=6379
      # Keeps step execution in-process; the sandboxed mode needs extra
      # privileges the LazyCat runtime does not grant.
      - AP_EXECUTION_MODE=UNSANDBOXED
      - AP_TELEMETRY_ENABLED=false
      - AP_TEMPLATES_SOURCE_URL=
      - TZ=Asia/Shanghai
    binds:
      - /lzcapp/var/data:/root/.activepieces

usage: |
  Activepieces 是开源自动化平台：把各种应用连成流程，收到事件就自动做事。

  使用方法：
  1. 打开应用，**注册第一个账号**（首个注册用户即为管理员），密码自己设。
  2. 建一个 Flow（流程）：选一个触发方式，比如定时、Webhook，或某个应用里的事件。
  3. 往下加步骤：调用其它应用的接口、处理数据、发通知。
  4. 保存并启用，之后每次触发都会留下运行记录，可以在界面上看每步的输入输出。

  数据与安全：
  - 流程定义、运行记录和文件在 PostgreSQL（/lzcapp/var/pgdata）与 /lzcapp/var/data，
    缓存与队列在 /lzcapp/var/redis。卸载应用会一并删除，请定期备份。
  - 账号由你首次注册时创建，不存在内置弱口令。
  - 加密密钥、JWT 密钥、数据库密码均由平台稳定密钥生成，每个部署不同；
    请勿改动加密密钥，否则已保存的连接凭据将无法解密。
  - 应用直接对外开放，由应用自己的登录页鉴权：
    自带账号体系的服务再套一层平台鉴权会造成重复登录，所以用 public_path。

  说明：
  - 三个容器：Activepieces + PostgreSQL 16 + Redis 7。启动顺序由依赖关系保证。
  - 已关闭匿名统计，并关闭云端模板源（不向外部拉取模板）。
  - 执行模式使用 UNSANDBOXED（步骤在应用进程内运行），
    因此沙箱模式下才可用的隔离特性不可用；一般自动化流程不受影响。
  - 未做真机验证：注册、建流程、触发运行以及重启后持久化均未在设备上实测。
